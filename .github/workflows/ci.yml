name: ci

# typecheck and tests are the whole gate in this repo -- there is no linter -- so run them on
# every push and PR rather than trusting that someone remembered locally. The suite needs no
# network and no key, which is why it can run here at all.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
